[workspace]
members = [
    "crates/workload-spec",
    "crates/keys",
    "crates/object-store",
    # R736-F1 (W250): the global tenant->cell pointer record + its read/CAS
    # helpers, layered on object-store's put_if rather than living inside it.
    "crates/tenant-pointer",
    # R736-F4 (W250 / W252 §5): the cross-cell move protocol that advances that
    # pointer — an idempotent, resumable state machine whose effects (quiesce,
    # ship, hydrate, commit) are a trait, so it depends on neither yubaba nor
    # turso-backup.
    "crates/tenant-move",
    "crates/local-driver",
    "crates/mesofact-bundle",
]
resolver = "2"

[workspace.package]
version = "0.8.30"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/yah-base"
