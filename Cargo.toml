[workspace]
members = [
    "crates/workload-spec",
    "crates/keys",
    "crates/object-store",
    "crates/local-driver",
    "crates/mesofact-bundle",
]
resolver = "2"

[workspace.package]
version = "0.8.20"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/yah-base"
