[package]
name = "yah-mesofact-bundle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "W272 mesofact bundle format: content-addressed manifest + digest types, and a feature-gated R2 blob store (publish / node-side materialize / LRU cache)."

[lib]
name = "yah_mesofact_bundle"
path = "src/lib.rs"

[features]
# Default is types-only (serde + blake3 + toml). The mesofact-build subcamp
# consumer (R599-F2) links this crate with `default-features = false` so it
# never pulls the object-store / reqwest weight across the workspace boundary.
default = []

# The node/cloud store surface: publish an assembled bundle to an object store
# (append-only, blob-deduped) and materialize one back into an LRU cache dir.
# Pulls yah-object-store (reqwest). cloud + kamaji enable this; mesofact-build
# does not.
store = ["dep:yah-object-store"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Reads the sliver of the build's `dist/manifest.json` that names each route's
# `data_inputs`, so assembly can stage them into the bundle.
serde_json = "1"
blake3 = "1"
toml = "0.8"
thiserror = "1"
# Asset index + publish-time precompression (MFT-R825-F1, src/assets.rs).
# sha256 because an asset's ETag is the same digest a mesofact manifest records
# as `content_hash`. Unconditional rather than feature-gated on purpose: every
# assembly entry point finalizes, so a feature-off build would assemble bundles
# that silently differ from a feature-on one.
sha2 = "0.10"
brotli = "8"
flate2 = "1"

# Only linked when the `store` feature is on.
yah-object-store = { path = "../object-store", version = "0.8.45", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
