[package]
name = "yah-local-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-tier infrastructure primitives shared by cloud (sim/pond reconciler) and yubaba (pond MinIO slot lifecycle): docker-CLI runtime detection + S3 SigV4 helpers."

# Pin the lib name so consumers' `use local_driver` keeps resolving after the
# yah- package rename (consumers alias the crate via `package = "yah-local-driver"`).
[lib]
name = "local_driver"
path = "src/lib.rs"

[features]
# Derive JsonSchema on the config types a mirror can spell — today just
# `PasswayAuth`, which `IngressEdge::auth` embeds verbatim (R870-F26) so the
# five bearer-auth settings have ONE definition rather than a config-side copy
# that can drift from the renderer. Off by default, mirroring workload-spec:
# the runtime callers of this crate don't pull schemars.
json-schema = ["dep:schemars", "workload-spec/json-schema"]

[dependencies]
# WorkloadSpec — LocalDockerRuntime implements workload_spec::WorkloadRuntime
# to plug the docker-CLI driver into the yubaba seam (R256-F10).
workload-spec = { package = "yah-workload-spec", path = "../workload-spec", version = "0.8.40" }

# Only under `json-schema` — see the feature's comment above.
schemars = { version = "0.8", optional = true }

anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "net", "time", "sync", "fs", "io-util"] }
tracing = "0.1"

# Serde — MinioSpec / MinioRunning derive Serialize/Deserialize so yubaba's
# pond/deploy HTTP body and cloud's reconciler can share them.
serde = { version = "1.0", features = ["derive"] }
# serde_json — MiniflareSpec encodes ssr_prefixes as a JSON array string for
# the Worker's SSR_PREFIXES binding (R434-F4).
serde_json = "1.0"

# S3 SigV4 helpers (s3_sign module).
hmac = { version = "0.12", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
