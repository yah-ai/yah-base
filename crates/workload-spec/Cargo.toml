# @yah:assignee(agent:claude)
# @yah:at(2026-05-18T16:35:03Z)
# @yah:status(review)
# @yah:next("Rename one of the export-ts binary targets to avoid cargo hard error (currently a warning)")
# @yah:verify("cargo check -p tower-rules -p workload-spec 2>&1 | grep -v 'failed to parse serde' | grep -v '^  =' | grep -v 'ts-rs failed'")

[package]
name = "yah-workload-spec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WorkloadSpec — typed wire format for yubaba workloads. Schema crate with zero deps on yubaba; yubaba depends on this, not the other way around."

[lib]
name = "workload_spec"
path = "src/lib.rs"

[features]
# Derive JsonSchema on WorkloadSpec + nested types so xtask can emit
# .yah/schema/workload.toml.schema.json (R222 B4). Off by default;
# runtime callers don't pull schemars in.
json-schema = ["dep:schemars"]

# R706 (W293): the AES-256-GCM seal used to originate a cluster secret.
# Off by default — this is a schema crate, and a consumer that only needs the
# types (kamaji, the TS export, the JSON-Schema pipeline) should not link a
# cipher. Enabled by the two crates that actually seal: yubaba's ACME issuer
# (on the node) and the yah CLI's `cloud secret put` (in the camp). One impl,
# so the nonce discipline can't drift between the two writers.
seal = ["dep:aes-gcm", "dep:zeroize"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
regex = "1.0"
ts-rs = { version = "12.0", features = ["serde-compat"] }
schemars = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", features = ["zeroize"], optional = true }
zeroize = { version = "1", optional = true }
async-trait = "0.1"
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"
toml = "0.8"
# Binary, non-self-describing wire — the kamaji UDS format. Used to guard that
# a WorkloadSpec (with its nested ImageRef) survives a postcard round-trip
# (R590-B3: the untagged ImageRef Deserialize used to die on postcard decode).
postcard = { version = "1.1", features = ["use-std"] }

# `cargo run -p yah-workload-spec --bin export-ts` regenerates
# packages/yah/workload-spec/index.ts from the Rust source of truth.
[[bin]]
name = "export-ts"
path = "src/bin/export-ts.rs"
